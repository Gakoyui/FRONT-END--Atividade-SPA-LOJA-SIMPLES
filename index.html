<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="app" href="javascript/app.js">
  <title>SPA - Cadastro de Alunos</title>

</head>
<body>
  <header>
    <nav>
      <button data-rota="inicio" class="ativo">Início</button>
      <button data-rota="cadastro">Cadastrar Aluno</button>
      <button data-rota="lista">Lista de Alunos</button>
      <button data-rota="sobre">Sobre</button>
    </nav>
  </header>

  <main id="app"></main>

  <script>
    // Os dados ficam apenas na memória.
    // Se a página for atualizada, eles serão apagados.
    const alunos = [];

    const app = document.querySelector("#app");
    const botoesMenu = document.querySelectorAll("nav button");

    function marcarMenuAtivo(rota) {
      botoesMenu.forEach(botao => {
        botao.classList.toggle("ativo", botao.dataset.rota === rota);
      });
    }

    function irPara(rota) {
      marcarMenuAtivo(rota);

      if (rota === "inicio") mostrarInicio();
      if (rota === "cadastro") mostrarCadastro();
      if (rota === "lista") mostrarLista();
      if (rota === "sobre") mostrarSobre();
    }

    function mostrarInicio() {
      app.innerHTML = `
        <h1>Sistema de Cadastro de Alunos</h1>
        <p>
          Este é um exemplo simples de SPA feita com HTML, CSS e JavaScript.
          A navegação acontece sem recarregar a página.
        </p>

        <p>
          Os alunos cadastrados ficam temporariamente guardados em um array JavaScript.
        </p>

        <div class="contador">
          Alunos cadastrados nesta sessão: <strong>${alunos.length}</strong>
        </div>

        <div class="acoes">
          <button class="botao" id="btnCadastrar">Cadastrar aluno</button>
          <button class="botao secundario" id="btnVerAlunos">Ver alunos</button>
        </div>
      `;

      document.querySelector("#btnCadastrar")
        .addEventListener("click", () => irPara("cadastro"));

      document.querySelector("#btnVerAlunos")
        .addEventListener("click", () => irPara("lista"));
    }

    function mostrarCadastro() {
      app.innerHTML = `
        <h1>Cadastrar Aluno</h1>

        <form id="formAluno">
          <div class="campo">
            <label for="nome">Nome</label>
            <input id="nome" type="text" placeholder="Digite o nome do aluno" required />
          </div>

          <div class="campo">
            <label for="curso">Curso</label>
            <input id="curso" type="text" placeholder="Digite o curso" required />
          </div>

          <div class="campo">
            <label for="matricula">Matrícula</label>
            <input id="matricula" type="text" placeholder="Digite a matrícula" required />
          </div>

          <button class="botao" type="submit">Salvar aluno</button>
          <div id="mensagem"></div>
        </form>
      `;

      document.querySelector("#formAluno").addEventListener("submit", function(evento) {
        evento.preventDefault();

        const nome = document.querySelector("#nome").value.trim();
        const curso = document.querySelector("#curso").value.trim();
        const matricula = document.querySelector("#matricula").value.trim();

        alunos.push({
          nome,
          curso,
          matricula
        });

        document.querySelector("#mensagem").innerHTML =
          `<div class="mensagem">Aluno cadastrado com sucesso.</div>`;

        evento.target.reset();
      });
    }

    function mostrarLista() {
      app.innerHTML = `
        <h1>Lista de Alunos</h1>
        <p>Esta tabela é criada dinamicamente pelo JavaScript a partir do array de alunos.</p>
        <div id="conteudoLista"></div>
      `;

      renderizarTabela();
    }

    function renderizarTabela() {
      const conteudo = document.querySelector("#conteudoLista");

      if (alunos.length === 0) {
        conteudo.innerHTML = `
          <div class="vazio">
            Nenhum aluno cadastrado ainda.
          </div>
        `;
        return;
      }

      let linhas = "";

      alunos.forEach((aluno, indice) => {
        linhas += `
          <tr>
            <td>${aluno.nome}</td>
            <td>${aluno.curso}</td>
            <td>${aluno.matricula}</td>
            <td>
              <button class="excluir" data-indice="${indice}">Excluir</button>
            </td>
          </tr>
        `;
      });

      conteudo.innerHTML = `
        <table>
          <thead>
            <tr>
              <th>Nome</th>
              <th>Curso</th>
              <th>Matrícula</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody>
            ${linhas}
          </tbody>
        </table>
      `;

      document.querySelectorAll(".excluir").forEach(botao => {
        botao.addEventListener("click", function() {
          const indice = Number(this.dataset.indice);
          alunos.splice(indice, 1);
          renderizarTabela();
        });
      });
    }

    function mostrarSobre() {
      app.innerHTML = `
        <h1>Sobre o projeto</h1>
        <p>
          Este exemplo foi criado para demonstrar uma Single Page Application simples.
        </p>
        <p>
          Existe apenas um arquivo HTML. Ao clicar nas opções do menu,
          o JavaScript modifica o conteúdo do elemento <strong>#app</strong>.
        </p>
        <p>
          O projeto também demonstra cadastro em array, manipulação do DOM,
          eventos de clique, envio de formulário, listagem e exclusão.
        </p>
      `;
    }

    botoesMenu.forEach(botao => {
      botao.addEventListener("click", () => {
        irPara(botao.dataset.rota);
      });
    });

    mostrarInicio();
  </script>
</body>
</html>
